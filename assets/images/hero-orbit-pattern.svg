<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <!-- Subtle center aura -->
  <defs>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#f8fafc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <circle cx="500" cy="500" r="480" fill="url(#centerAura)" />

  <!-- Outer & Inner Concentric Rings -->
  <circle cx="500" cy="500" r="460" stroke="#f1f5f9" stroke-width="1.2" />
  <circle cx="500" cy="500" r="390" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.85" />
  <circle cx="500" cy="500" r="310" stroke="#f1f5f9" stroke-width="1.2" />
  <circle cx="500" cy="500" r="230" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.8" />
  <circle cx="500" cy="500" r="150" stroke="#f1f5f9" stroke-width="1.2" />

  <!-- Elliptical Global Latitude / Longitude Arcs -->
  <ellipse cx="500" cy="500" rx="460" ry="220" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 7" opacity="0.75" />
  <ellipse cx="500" cy="500" rx="460" ry="110" stroke="#f1f5f9" stroke-width="1.2" opacity="0.9" />
  <ellipse cx="500" cy="500" rx="220" ry="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 7" opacity="0.75" />
  <ellipse cx="500" cy="500" rx="110" ry="460" stroke="#f1f5f9" stroke-width="1.2" opacity="0.9" />

  <!-- Delicate accent dots -->
  <circle cx="500" cy="110" r="2.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="500" cy="890" r="2.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="110" cy="500" r="2.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="890" cy="500" r="2.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="660" cy="340" r="3" fill="#cbd5e1" />
  <circle cx="340" cy="660" r="3" fill="#cbd5e1" />
</svg>
