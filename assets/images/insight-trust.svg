<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" fill="none">
  <defs>
    <radialGradient id="bloomGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="500" height="360" fill="#0d0e12" rx="16" />
  
  <!-- Subtle nebula backdrop -->
  <circle cx="250" cy="180" r="140" fill="url(#bloomGlow)" />
  
  <g transform="translate(250, 180)" filter="url(#glow)">
    <!-- Central blooming particles and light ribbons -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" />
    <circle cx="-5" cy="-8" r="6" fill="#fde047" opacity="0.8" />
    
    <!-- Flower petal-like bursts -->
    <path d="M0 0 Q20 -60 5 -90 Q-15 -60 0 0" fill="#f43f5e" opacity="0.8" />
    <path d="M0 0 Q60 -40 90 -20 Q60 10 0 0" fill="#ec4899" opacity="0.85" />
    <path d="M0 0 Q60 40 40 85 Q0 50 0 0" fill="#a855f7" opacity="0.8" />
    <path d="M0 0 Q-30 65 -70 60 Q-50 20 0 0" fill="#6366f1" opacity="0.75" />
    <path d="M0 0 Q-70 10 -95 -25 Q-50 -30 0 0" fill="#38bdf8" opacity="0.8" />
    <path d="M0 0 Q-40 -60 -20 -85 Q10 -50 0 0" fill="#fb923c" opacity="0.8" />

    <!-- Stardust scatter dots -->
    <circle cx="45" cy="-75" r="2.5" fill="#ffffff" />
    <circle cx="85" cy="-55" r="3" fill="#fbcfe8" />
    <circle cx="-65" cy="-70" r="2" fill="#fed7aa" />
    <circle cx="-110" cy="-10" r="2.5" fill="#c7d2fe" />
    <circle cx="110" cy="20" r="2" fill="#f472b6" />
    <circle cx="70" cy="80" r="3" fill="#e9d5ff" />
    <circle cx="-45" cy="95" r="2.5" fill="#a5f3fc" />
    <circle cx="-90" cy="60" r="2" fill="#fecdd3" />
    <circle cx="20" cy="-110" r="2" fill="#ffffff" />
    <circle cx="-15" cy="115" r="1.5" fill="#fef08a" />
    
    <!-- Fine filament lines -->
    <path d="M0 0 C40 -90, 80 -80, 115 -100" stroke="#fbcfe8" stroke-width="1.2" opacity="0.7" fill="none" />
    <path d="M0 0 C-60 -80, -90 -100, -125 -90" stroke="#fed7aa" stroke-width="1.2" opacity="0.7" fill="none" />
    <path d="M0 0 C80 30, 120 70, 140 60" stroke="#f472b6" stroke-width="1.2" opacity="0.6" fill="none" />
    <path d="M0 0 C-50 70, -80 110, -110 120" stroke="#818cf8" stroke-width="1.2" opacity="0.6" fill="none" />
  </g>
</svg>
